name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK via apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-tools android-sdk-build-tools android-sdk-platform-34 || sudo apt-get install -y -qq android-sdk
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/lib/android-sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/lib/android-sdk}" >> $GITHUB_ENV

      - name: SDK manager platform/build-tools
        run: |
          export PATH="${ANDROID_HOME:-/usr/lib/android-sdk}/cmdline-tools/latest/bin:${ANDROID_HOME:-/usr/lib/android-sdk}/platform-tools:${PATH}"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Buat keystore debug kalau belum ada
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Starshore-apk
          path: app/build/outputs/apk/release/*.apk
