name: Build APK

on:
  push:
    branches: [main, master]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cek kunci rilis ada (hanya tag v)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secret kunci rilis kosong pada run tag; batalkan, jangan rilis APK debug-signed"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK via apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-tools android-sdk-build-tools android-sdk-platform-34 || sudo apt-get install -y -qq android-sdk
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/lib/android-sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/lib/android-sdk}" >> $GITHUB_ENV

      - name: SDK manager platform/build-tools
        run: |
          export PATH="${ANDROID_HOME:-/usr/lib/android-sdk}/cmdline-tools/latest/bin:${ANDROID_HOME:-/usr/lib/android-sdk}/platform-tools:${PATH}"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Buat keystore debug kalau belum ada
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Siapkan kunci rilis dari brankas
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rilis otomatis (hanya tag v)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Starshore-${GITHUB_REF_NAME#v}.apk"
          ( cd dist && sha256sum Starshore-*.apk > SHA256SUMS.txt )
          gh release create "$GITHUB_REF_NAME" \
            "dist/Starshore-${GITHUB_REF_NAME#v}.apk" dist/SHA256SUMS.txt \
            --notes-file RELEASE_NOTES.md --draft

      - uses: actions/upload-artifact@v4
        with:
          name: Starshore-apk
          path: app/build/outputs/apk/release/*.apk
